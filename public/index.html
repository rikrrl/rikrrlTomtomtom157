<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Roblox AI Studio – KI-Entwickler für Roblox</title>
  <meta name="description" content="Beschreibe dein Roblox-Spiel oder füge einen Roblox-Link ein – die KI erzeugt ein vollständiges Spiel, bearbeitet es im Chat und exportiert es für Roblox Studio." />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c5cff'/%3E%3Cpath d='M9 9h9a5 5 0 0 1 0 10h-4v5H9z' fill='white'/%3E%3C/svg%3E" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">AI</div>
        <div class="brand-text">
          <strong>Roblox AI Studio</strong>
          <span>KI-Entwickler für Roblox</span>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-btn" data-action="new-prompt">
          <span class="ico">✦</span> Spiel beschreiben
        </button>
        <button class="nav-btn" data-action="new-link">
          <span class="ico">🔗</span> Link nachbauen
        </button>
        <button class="nav-btn ghost" data-action="plugin">
          <span class="ico">🧩</span> Studio-Plugin
        </button>
      </nav>

      <div class="sidebar-section">
        <div class="section-head">
          <span>Projekte</span>
          <span class="count" id="project-count">0</span>
        </div>
        <div class="project-list" id="project-list">
          <p class="empty">Noch keine Projekte.</p>
        </div>
      </div>

      <div class="sidebar-foot">
        <div class="pill"><span class="dot live"></span> Lokale Engine · kostenlos</div>
        <p class="tiny">Alle Berechnungen laufen auf diesem Server. Keine API-Keys, keine Nutzungslimits.</p>
      </div>
    </aside>

    <main class="main" id="main">
      <div class="topbar">
        <div class="crumbs" id="crumbs">Übersicht</div>
        <div class="topbar-actions">
          <span class="badge" id="engine-badge">Engine bereit</span>
        </div>
      </div>
      <div id="view" class="view"></div>
    </main>
  </div>

  <div class="toast-wrap" id="toasts"></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
